# nginx-Konfiguration für die statische Website (läuft im Container auf Port 8080)

# IP-Adressen nur gekürzt loggen (DSGVO): letztes Oktett (IPv4) bzw. hintere Blöcke (IPv6) werden entfernt
map $remote_addr $remote_addr_anon {
  ~(?P<ip>\d+\.\d+\.\d+)\.\d+   $ip.0;
  ~(?P<ip>[^:]+:[^:]+:[^:]+):   $ip::;
  default                       0.0.0.0;
}
log_format anon '$remote_addr_anon - [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  access_log /dev/stdout anon;
  server_tokens off;
  charset utf-8;
  include /etc/nginx/mime.types;
  types { application/manifest+json webmanifest; }

  # Kompression
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json application/xml text/xml;

  # Sicherheits-Header
  include /etc/nginx/conf.d/security-headers.inc;

  # Healthcheck für Docker
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # HTML nie lange cachen, damit Änderungen sofort sichtbar sind
  location ~* \.html$ {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/conf.d/security-headers.inc;
  }

  # Statische Dateien eine Woche cachen
  location ~* \.(css|js|woff2|jpg|jpeg|png|webp|svg|mp4|webm|ico|webmanifest)$ {
    expires 7d;
    add_header Cache-Control "public" always;
    include /etc/nginx/conf.d/security-headers.inc;
  }

  location / {
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/conf.d/security-headers.inc;
  }
}
